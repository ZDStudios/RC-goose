# honk300 — Cargo workspace root.
#
# A deliberate divergence from the single-crate *300 sibling repos (TR300/ND300/WB300):
# the workspace forces the platform-agnostic engine (`honk-engine`) to never `use` an OS
# crate. The shipped product runtime remains one public binary installed under three names;
# Windows packages additionally carry one branded GUI-subsystem launcher for typed start,
# shortcuts, and login startup; its hidden console-free sibling process owns the runtime.
#
# M19 owns the release metadata and installer/update lifecycle. Round R3 (ADR 0017) adds the two
# Apple targets so cargo-dist emits darwin tar.xz archives and the shell installer covers macOS;
# the universal2 `.app`/DMG is built by the hand-authored `macos-packaging.yml`. Stable macOS
# artifacts are Developer ID signed, notarized, and stapled under ADR 0020.

[workspace]
resolver = "2"
members = [
    "crates/honk-config",
    "crates/honk-config-tui",
    "crates/honk-control",
    "crates/honk-engine",
    "crates/honk-platform-linux",
    "crates/honk-platform-macos",
    "crates/honk-platform-windows",
]

[workspace.package]
# Edition 2021 matches the family majority (TR300/ND300 = 2021; WB300 = 2024). Locked
# decision C3 in honk300_plan.md. Editions are per-crate language epochs; 1.95 supports
# either. MSRV is pinned in lockstep with rust-toolchain.toml — bump both together.
edition = "2021"
rust-version = "1.95"
authors = ["Emmett S <hey@emmetts.dev>"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/RealEmmettS/goose"

[workspace.dependencies]
# CPU vector raster of the procedural goose (clean-room renderer). Pure Rust, no OS deps.
# `png-format` pulls the `png` encoder used by the offscreen golden-frame test harness.
tiny-skia = { version = "0.11", features = ["png-format"] }

# The root package ships the `honk300` CLI/runtime plus a Windows-only GUI-subsystem launcher.
# The latter is deliberately selected only for Windows archives and installers so Explorer,
# shortcuts, and login startup never allocate or focus a console. M1/M2 wire the engine to the
# Windows overlay; M10 adds CLI/IPC control, and M12 owns the full config TUI.
[package]
name = "honk300"
version = "1.11.3"
description = "Cross-platform Desktop Goose — a procedural goose that roams your screen"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
default-run = "honk300"
include = [
    "/build.rs",
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/THIRD_PARTY_ASSETS.md",
    "/Assets/**",
    "/settings/assets/icon.png",
    "/crates/**",
    "/src/**",
    "/integrations/kwin/**",
    "/integrations/gnome/**",
    "/script/**",
    "!/script/**/__pycache__/**",
    "/wix/**",
    "/wix-corporate/**",
    "/inno/**",
    "!/inno/Output/**",
]

[package.metadata.wix]
upgrade-guid = "327D92E2-33FA-4B3B-887B-D37745A7A7E6"
path-guid = "A563EAE7-451A-48C3-8AB0-1A998F9AF47F"
license = false
eula = false

[[bin]]
name = "honk300"
path = "src/main.rs"

[[bin]]
name = "honk300-app"
path = "src/bin/honk300-app.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29"
honk-config = { path = "crates/honk-config" }
honk-config-tui = { path = "crates/honk-config-tui" }
honk-control = { path = "crates/honk-control" }
honk-engine = { path = "crates/honk-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
embed-resource = "3.0.11"

[target.'cfg(windows)'.dependencies]
honk-platform-windows = { path = "crates/honk-platform-windows" }
# Opt-in remote control (ADR 0059), Windows-first because the tray indicator ships there first:
# one blocking outbound WebSocket thread. TLS uses rustls with the pure ring provider and bundled
# Mozilla roots, so no system OpenSSL or aws-lc toolchain is needed.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tungstenite = { version = "0.27", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# Audio playback (honks/bite/mud/pat). Pure-Rust decode via symphonia; cpal backend.
# Windows-scoped for now; the macOS/Linux backends wire audio in M16/M17.
rodio = "0.20"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
honk-platform-macos = { path = "crates/honk-platform-macos" }
rodio = "0.20"

[target.'cfg(target_os = "linux")'.dependencies]
honk-platform-linux = { path = "crates/honk-platform-linux" }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
rodio = "0.20"

[dev-dependencies]
tempfile = "3"

# Temporary security backport of upstream revision d07c4f91f28b42e5a485823ffd9d8d5a210b1053:
# crates.io wayland-scanner 0.31.10 is vendored with only that revision's quick-xml 0.41 fix.
# The full upstream revision also contains unreleased breaking Wayland API work, so pinning the
# whole git snapshot is incompatible with released smithay-client-toolkit 0.20. Remove this path
# patch when a crates.io wayland-scanner release contains the d07 fix.
[patch.crates-io]
wayland-scanner = { path = "vendor/wayland-scanner" }

# The profile cargo-dist will build with in the later packaging round.
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = "github"
allow-dirty = ["ci"]
installers = []
include = ["THIRD_PARTY_ASSETS.md", "settings/assets/icon.png"]
targets = [
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]
pr-run-mode = "plan"
install-updater = false
install-path = "CARGO_HOME"
publish-prereleases = false

[workspace.metadata.dist.binaries]
x86_64-pc-windows-msvc = ["honk300", "honk300-app"]
aarch64-pc-windows-msvc = ["honk300", "honk300-app"]
x86_64-apple-darwin = ["honk300"]
aarch64-apple-darwin = ["honk300"]
x86_64-unknown-linux-gnu = ["honk300"]
aarch64-unknown-linux-gnu = ["honk300"]
x86_64-unknown-linux-musl = ["honk300"]
aarch64-unknown-linux-musl = ["honk300"]
